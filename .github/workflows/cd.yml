name: Publish

on:
  push:
    branches:
      - main
      # Maintenance line for ts-migrating 1.x (TypeScript 5–6).
      - v1

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Extract version info
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if echo "$VERSION" | grep -qE '(alpha|beta|rc)'; then
            PRERELEASE_TAG=$(echo "$VERSION" | grep -oE '(alpha|beta|rc)')
            echo "prerelease_tag=$PRERELEASE_TAG" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      # Releases from `v1` get a `-1` suffixed dist-tag (`latest-1`, `beta-1`, ...)
      # so a 1.x patch never takes over `latest` or `beta` from 2.x.
      - name: Publish stable release to npm
        if: steps.version.outputs.is_prerelease == 'false'
        run: pnpm -r publish --tag ${{ github.ref_name == 'v1' && 'latest-1' || 'latest' }}

      - name: Publish pre-release to npm
        if: steps.version.outputs.is_prerelease == 'true'
        run: pnpm -r publish --tag ${{ steps.version.outputs.prerelease_tag }}${{ github.ref_name == 'v1' && '-1' || '' }}
