name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Build, Lint, Format and TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint and Formating
        run: pnpm check:lint

      - name: Type check
        run: pnpm check:type

  test:
    name: Test (TypeScript ${{ matrix.typescript }}, Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # TODO: switch to "~7.1" once TypeScript 7.1 is released.
        typescript: ["7.1.0-beta"]
        # the lowest supported Node.js (engines.node) and the development one (devEngines)
        node: ["22.18.0", "24"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Override TypeScript version
        run: pnpm add -D typescript@${{ matrix.typescript }}

      - name: Test
        run: pnpm test
